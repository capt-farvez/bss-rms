<nz-header>
  <div class="d-flex justify-content-between align-items-center w-100 ps-0 pe-3 pe-md-4">
    <!-- Left Section -->
    <div class="d-flex flex-row">
      <!-- Sidebar Toggle Button (Desktop) -->
      <div class="d-flex align-items-center">
        <span
          class="trigger d-none d-md-block text-xl ps-3 pe-3"
          nz-icon
          [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"
          (click)="onToggleSidebar()">
        </span>
      </div>

      <!-- Page Title -->
      <div class="header-title ps-3 pe-2 ps-md-0 truncate">
        <p>{{ getPageTitle() }}</p>
      </div>
    </div>

    <!-- Right Section - User Info -->
    <div class="d-flex w-auto justify-content-end gap-2">
      <!-- User Details (Desktop only) -->
      <div class="d-none d-md-flex flex-col gap-1 justify-end">
        <div class="text-sm text-end text-gray-700">{{ currentUser().email }}</div>
        <div class="text-xl font-semibold text-end text-gray-700">{{ currentUser().fullName }}</div>
      </div>

      <!-- User Avatar with Dropdown -->
      <nz-avatar
        nz-dropdown
        [nzDropdownMenu]="menu"
        [nzSize]="60"
        nzIcon="user"
        [nzSrc]="getUserImage(currentUser().image)"
        class="drop-shadow-md"
        style="background-color: #66bb6a">
      </nz-avatar>

      <!-- Dropdown Menu -->
      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu nzSelectable>
          <li (click)="showProfile()" nz-menu-item class="h-11 text-lg">
            <span nz-icon nzType="user" class="ps-1 pe-1" nzTheme="outline" style="color:#66bb6a"></span>
            Profile
          </li>
          <li (click)="onLogout()" nz-menu-item class="h-11 text-lg">
            <span nz-icon nzType="logout" class="ps-1 pe-1" nzTheme="outline" style="color:orangered"></span>
            Logout
          </li>
        </ul>
      </nz-dropdown-menu>
    </div>
  </div>
</nz-header>
