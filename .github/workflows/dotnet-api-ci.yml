name: .NET API Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      working-directory: ./bss-rms-api
      run: dotnet restore BssRmsApi.sln

    - name: Build
      working-directory: ./bss-rms-api
      run: dotnet build BssRmsApi.sln --configuration Release --no-restore
