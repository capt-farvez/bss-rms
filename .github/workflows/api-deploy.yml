name: API Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'bss-rms-api/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bss-rms-api/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      working-directory: ./bss-rms-api
      run: dotnet restore BssRmsApi.sln

    - name: Build
      working-directory: ./bss-rms-api
      run: dotnet build BssRmsApi.sln --configuration Release --no-restore

    - name: Publish API
      working-directory: ./bss-rms-api
      run: dotnet publish src/BssRms.Api/BssRms.Api/BssRms.Api.csproj -c Release -o ./publish --no-build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-release
        path: ./bss-rms-api/publish
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/api-v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./bss-rms-api/publish/**/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: api-release
        path: ./publish

    - name: FTP Deploy to MonsterASP.net
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: site41329.siteasp.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        local-dir: ./publish/
        server-dir: ./wwwroot/
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/appsettings.Development.json
        log-level: verbose
