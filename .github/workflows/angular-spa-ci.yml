name: Angular Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: bss-rms-spa/package-lock.json

    - name: Install dependencies
      working-directory: ./bss-rms-spa
      run: npm ci

    - name: Build
      working-directory: ./bss-rms-spa
      run: npm run build