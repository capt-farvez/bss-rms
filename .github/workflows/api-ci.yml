name: API CI - Build and Test

on:
  push:
    branches: [ Main, development ]
    paths:
      - 'bss-rms-api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [ Main, development ]
    paths:
      - 'bss-rms-api/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      working-directory: ./bss-rms-api
      run: dotnet restore BssRmsApi.sln

    - name: Build
      working-directory: ./bss-rms-api
      run: dotnet build BssRmsApi.sln --configuration Release --no-restore

    - name: Test
      working-directory: ./bss-rms-api
      run: dotnet test BssRmsApi.sln --configuration Release --no-build --verbosity normal || echo "No tests found"

    - name: Check for build errors
      working-directory: ./bss-rms-api
      run: |
        echo "Build completed successfully!"
        echo "Project is ready for deployment to main branch."
